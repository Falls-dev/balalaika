server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # После настройки TLS замените этот блок на перенаправление HTTPS.
    client_max_body_size 1m;

    location = /api {
        proxy_pass http://127.0.0.1:3050;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3050;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Конечная косая черта у alias обязательна: /media/<id>/output.mp3
    # соответствует /opt/floxy/cache/<id>/output.mp3.
    location ^~ /media/ {
        alias /opt/floxy/cache/;
        autoindex off;
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        return 404;
    }
}
